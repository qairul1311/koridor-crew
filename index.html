<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crew">
<meta name="theme-color" content="#141728">
<title>Koridor Crew</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="login" hidden>
    <div class="brand">
      <div class="mark">Koridor <em>Crew</em></div>
      <p id="loginGreet">Enter your 4-digit PIN</p>
    </div>
    <div class="dots" id="pinDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="login-msg" id="loginMsg" role="alert"></p>
    <div class="keypad" id="keypad" aria-label="PIN keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="blank" tabindex="-1" aria-hidden="true"></button>
      <button data-k="0">0</button>
      <button class="del" data-k="del" aria-label="Delete">⌫</button>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="who" id="who"></div>
      <span class="sync" id="sync" title="Live"></span>
    </header>
    <div id="banners"></div>
    <main id="view"><div class="loading"><span class="spinner"></span>Loading…</div></main>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </div>

  <div id="sheet" hidden></div>
  <div id="dialog" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
